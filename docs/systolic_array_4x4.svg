<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1f6fb2"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2e8b57"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>

  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">Weight-stationary systolic array (4×4 shown, design uses 8×8)</text>

  <!-- B weights entering from top -->
  <text x="330" y="70" fill="#2e8b57" font-weight="bold">B tile weights loaded once per tile (one column each, held in w_reg)</text>
  <g stroke="#2e8b57" stroke-width="2" fill="none">
    <line x1="360" y1="80" x2="360" y2="105" marker-end="url(#arg)"/>
    <line x1="470" y1="80" x2="470" y2="105" marker-end="url(#arg)"/>
    <line x1="580" y1="80" x2="580" y2="105" marker-end="url(#arg)"/>
    <line x1="690" y1="80" x2="690" y2="105" marker-end="url(#arg)"/>
  </g>

  <!-- A rows entering from left with skew -->
  <text x="20" y="100" fill="#1f6fb2" font-weight="bold">A rows stream in</text>
  <text x="20" y="116" fill="#1f6fb2">(1 INT8 / clock, row i</text>
  <text x="20" y="132" fill="#1f6fb2">delayed i cycles = skew)</text>

  <!-- skew delay registers -->
  <g fill="#e8f0fa" stroke="#1f6fb2">
    <!-- row0: no delay -->
    <!-- row1: 1 reg -->
    <rect x="240" y="225" width="18" height="30" rx="3"/>
    <!-- row2: 2 regs -->
    <rect x="216" y="335" width="18" height="30" rx="3"/>
    <rect x="240" y="335" width="18" height="30" rx="3"/>
    <!-- row3: 3 regs -->
    <rect x="192" y="445" width="18" height="30" rx="3"/>
    <rect x="216" y="445" width="18" height="30" rx="3"/>
    <rect x="240" y="445" width="18" height="30" rx="3"/>
  </g>
  <text x="170" y="182" fill="#1f6fb2" font-size="12">row 0  a[0][k]</text>
  <text x="170" y="292" fill="#1f6fb2" font-size="12">row 1  a[1][k]</text>
  <text x="150" y="402" fill="#1f6fb2" font-size="12">row 2  a[2][k]</text>
  <text x="130" y="512" fill="#1f6fb2" font-size="12">row 3  a[3][k]</text>
  <text x="180" y="500" fill="#1f6fb2" font-size="10">delay regs</text>

  <!-- A arrows into first column -->
  <g stroke="#1f6fb2" stroke-width="2" fill="none">
    <line x1="245" y1="130" x2="315" y2="130" marker-end="url(#arb)"/>
    <line x1="262" y1="240" x2="315" y2="240" marker-end="url(#arb)"/>
    <line x1="262" y1="350" x2="315" y2="350" marker-end="url(#arb)"/>
    <line x1="262" y1="460" x2="315" y2="460" marker-end="url(#arb)"/>
  </g>

  <!-- PE grid: cols x=320,430,540,650 ; rows y=110,220,330,440 ; size 80x50 -->
  <g id="pes">
    <g fill="#fff7e6" stroke="#c8781a" stroke-width="1.5">
      <rect x="320" y="110" width="80" height="50" rx="6"/><rect x="430" y="110" width="80" height="50" rx="6"/><rect x="540" y="110" width="80" height="50" rx="6"/><rect x="650" y="110" width="80" height="50" rx="6"/>
      <rect x="320" y="220" width="80" height="50" rx="6"/><rect x="430" y="220" width="80" height="50" rx="6"/><rect x="540" y="220" width="80" height="50" rx="6"/><rect x="650" y="220" width="80" height="50" rx="6"/>
      <rect x="320" y="330" width="80" height="50" rx="6"/><rect x="430" y="330" width="80" height="50" rx="6"/><rect x="540" y="330" width="80" height="50" rx="6"/><rect x="650" y="330" width="80" height="50" rx="6"/>
      <rect x="320" y="440" width="80" height="50" rx="6"/><rect x="430" y="440" width="80" height="50" rx="6"/><rect x="540" y="440" width="80" height="50" rx="6"/><rect x="650" y="440" width="80" height="50" rx="6"/>
    </g>
    <g fill="#5a3a0a" font-size="11" text-anchor="middle">
      <text x="360" y="130">PE 0,0</text><text x="470" y="130">PE 0,1</text><text x="580" y="130">PE 0,2</text><text x="690" y="130">PE 0,3</text>
      <text x="360" y="240">PE 1,0</text><text x="470" y="240">PE 1,1</text><text x="580" y="240">PE 1,2</text><text x="690" y="240">PE 1,3</text>
      <text x="360" y="350">PE 2,0</text><text x="470" y="350">PE 2,1</text><text x="580" y="350">PE 2,2</text><text x="690" y="350">PE 2,3</text>
      <text x="360" y="460">PE 3,0</text><text x="470" y="460">PE 3,1</text><text x="580" y="460">PE 3,2</text><text x="690" y="460">PE 3,3</text>
    </g>
    <g fill="#2e8b57" font-size="10" text-anchor="middle">
      <text x="360" y="150">w=b[0][0]</text><text x="470" y="150">w=b[0][1]</text><text x="580" y="150">w=b[0][2]</text><text x="690" y="150">w=b[0][3]</text>
      <text x="360" y="260">w=b[1][0]</text><text x="470" y="260">w=b[1][1]</text><text x="580" y="260">w=b[1][2]</text><text x="690" y="260">w=b[1][3]</text>
      <text x="360" y="370">w=b[2][0]</text><text x="470" y="370">w=b[2][1]</text><text x="580" y="370">w=b[2][2]</text><text x="690" y="370">w=b[2][3]</text>
      <text x="360" y="480">w=b[3][0]</text><text x="470" y="480">w=b[3][1]</text><text x="580" y="480">w=b[3][2]</text><text x="690" y="480">w=b[3][3]</text>
    </g>
  </g>

  <!-- horizontal A links -->
  <g stroke="#1f6fb2" stroke-width="2" fill="none">
    <line x1="400" y1="135" x2="428" y2="135" marker-end="url(#arb)"/><line x1="510" y1="135" x2="538" y2="135" marker-end="url(#arb)"/><line x1="620" y1="135" x2="648" y2="135" marker-end="url(#arb)"/>
    <line x1="400" y1="245" x2="428" y2="245" marker-end="url(#arb)"/><line x1="510" y1="245" x2="538" y2="245" marker-end="url(#arb)"/><line x1="620" y1="245" x2="648" y2="245" marker-end="url(#arb)"/>
    <line x1="400" y1="355" x2="428" y2="355" marker-end="url(#arb)"/><line x1="510" y1="355" x2="538" y2="355" marker-end="url(#arb)"/><line x1="620" y1="355" x2="648" y2="355" marker-end="url(#arb)"/>
    <line x1="400" y1="465" x2="428" y2="465" marker-end="url(#arb)"/><line x1="510" y1="465" x2="538" y2="465" marker-end="url(#arb)"/><line x1="620" y1="465" x2="648" y2="465" marker-end="url(#arb)"/>
  </g>

  <!-- vertical psum links -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="360" y1="160" x2="360" y2="218" marker-end="url(#ar)"/><line x1="470" y1="160" x2="470" y2="218" marker-end="url(#ar)"/><line x1="580" y1="160" x2="580" y2="218" marker-end="url(#ar)"/><line x1="690" y1="160" x2="690" y2="218" marker-end="url(#ar)"/>
    <line x1="360" y1="270" x2="360" y2="328" marker-end="url(#ar)"/><line x1="470" y1="270" x2="470" y2="328" marker-end="url(#ar)"/><line x1="580" y1="270" x2="580" y2="328" marker-end="url(#ar)"/><line x1="690" y1="270" x2="690" y2="328" marker-end="url(#ar)"/>
    <line x1="360" y1="380" x2="360" y2="438" marker-end="url(#ar)"/><line x1="470" y1="380" x2="470" y2="438" marker-end="url(#ar)"/><line x1="580" y1="380" x2="580" y2="438" marker-end="url(#ar)"/><line x1="690" y1="380" x2="690" y2="438" marker-end="url(#ar)"/>
    <line x1="360" y1="490" x2="360" y2="530" marker-end="url(#ar)"/><line x1="470" y1="490" x2="470" y2="530" marker-end="url(#ar)"/><line x1="580" y1="490" x2="580" y2="530" marker-end="url(#ar)"/><line x1="690" y1="490" x2="690" y2="530" marker-end="url(#ar)"/>
  </g>
  <text x="372" y="195" fill="#333" font-size="10">psum ↓ (INT32)</text>

  <!-- deskew and output -->
  <g fill="#f0f0f0" stroke="#666">
    <rect x="320" y="535" width="410" height="30" rx="5"/>
  </g>
  <text x="525" y="554" text-anchor="middle" fill="#333">Deskew registers  →  C tile columns  c[:][j]  (one column finishes per clock)</text>
  <text x="20" y="560" fill="#333" font-size="12">Output = C tile, INT32</text>

  <!-- PE internals callout -->
  <g transform="translate(760,110)">
    <rect x="0" y="0" width="185" height="150" rx="8" fill="#fbfbfb" stroke="#999"/>
    <text x="10" y="20" font-weight="bold" fill="#222">Inside one PE (every clock)</text>
    <rect x="15" y="35" width="65" height="22" rx="4" fill="#e6ffe6" stroke="#2e8b57"/>
    <text x="47" y="50" text-anchor="middle" font-size="11" fill="#2e8b57">w_reg</text>
    <text x="90" y="50" font-size="11" fill="#333">INT8, held</text>
    <text x="15" y="80" font-size="11" fill="#1f6fb2">a_in ─►</text>
    <text x="65" y="80" font-size="11" fill="#333">×  w_reg  → INT16</text>
    <text x="15" y="100" font-size="11" fill="#333">+ psum_in (INT32)</text>
    <text x="15" y="120" font-size="11" fill="#333">psum_out ◄─ register</text>
    <text x="15" y="140" font-size="11" fill="#1f6fb2">a_out ◄─ register (a_in)</text>
  </g>

  <!-- FPGA note -->
  <g transform="translate(760,280)">
    <rect x="0" y="0" width="185" height="215" rx="8" fill="#fff" stroke="#c8781a"/>
    <text x="10" y="20" font-weight="bold" fill="#c8781a">FPGA vs ASIC view</text>
    <text x="10" y="42" font-size="11" fill="#333">FPGA: 1 PE ≈ 1 DSP48 slice</text>
    <text x="10" y="58" font-size="11" fill="#333">(8×8 signed mult + acc fits</text>
    <text x="10" y="74" font-size="11" fill="#333">easily; 2 INT8 MACs per DSP</text>
    <text x="10" y="90" font-size="11" fill="#333">is possible with packing).</text>
    <text x="10" y="114" font-size="11" fill="#333">ASIC: each PE is ~300–500</text>
    <text x="10" y="130" font-size="11" fill="#333">std cells; 64 PEs ≈ 0.05 mm²</text>
    <text x="10" y="146" font-size="11" fill="#333">on 130 nm. Buffers + DMA</text>
    <text x="10" y="162" font-size="11" fill="#333">are likely bigger than the</text>
    <text x="10" y="178" font-size="11" fill="#333">array. There is no "DSP</text>
    <text x="10" y="194" font-size="11" fill="#333">budget", only area.</text>
  </g>

  <text x="20" y="600" fill="#555" font-size="12">Steady state: 4 A values enter per clock (8 in the real design) → 16 MACs per clock (64). Data never returns to memory mid-tile.</text>
</svg>
