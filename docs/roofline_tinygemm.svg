<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="0" y="0" width="1000" height="620" rx="0" fill="#fff" stroke="#fff" stroke-width="1.5"/>
<text x="20" y="30" font-size="18" fill="#222" text-anchor="start" font-weight="bold">Roofline: what limits throughput on your board</text>
<text x="20" y="50" font-size="12" fill="#333" text-anchor="start" font-weight="normal">Achievable MAC/s = min( peak compute,  DDR bandwidth × arithmetic intensity )</text>
<rect x="90" y="80" width="760" height="420" rx="0" fill="#fcfcfc" stroke="#999" stroke-width="1.5"/>
<line x1="90.0" y1="80" x2="90.0" y2="500" stroke="#e5e5e5" stroke-width="1"/>
<text x="90.0" y="516" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">0.1</text>
<line x1="90" y1="500.0" x2="850" y2="500.0" stroke="#e5e5e5" stroke-width="1"/>
<text x="82" y="504.0" font-size="11" fill="#777" text-anchor="end" font-weight="normal">0.1</text>
<line x1="280.0" y1="80" x2="280.0" y2="500" stroke="#e5e5e5" stroke-width="1"/>
<text x="280.0" y="516" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">1</text>
<line x1="90" y1="395.0" x2="850" y2="395.0" stroke="#e5e5e5" stroke-width="1"/>
<text x="82" y="399.0" font-size="11" fill="#777" text-anchor="end" font-weight="normal">1</text>
<line x1="470.0" y1="80" x2="470.0" y2="500" stroke="#e5e5e5" stroke-width="1"/>
<text x="470.0" y="516" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">10</text>
<line x1="90" y1="290.0" x2="850" y2="290.0" stroke="#e5e5e5" stroke-width="1"/>
<text x="82" y="294.0" font-size="11" fill="#777" text-anchor="end" font-weight="normal">10</text>
<line x1="660.0" y1="80" x2="660.0" y2="500" stroke="#e5e5e5" stroke-width="1"/>
<text x="660.0" y="516" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">100</text>
<line x1="90" y1="185.0" x2="850" y2="185.0" stroke="#e5e5e5" stroke-width="1"/>
<text x="82" y="189.0" font-size="11" fill="#777" text-anchor="end" font-weight="normal">100</text>
<line x1="850.0" y1="80" x2="850.0" y2="500" stroke="#e5e5e5" stroke-width="1"/>
<text x="850.0" y="516" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">1000</text>
<line x1="90" y1="80.0" x2="850" y2="80.0" stroke="#e5e5e5" stroke-width="1"/>
<text x="82" y="84.0" font-size="11" fill="#777" text-anchor="end" font-weight="normal">1000</text>
<text x="470.0" y="540" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">Arithmetic intensity  (MACs performed per byte of weights fetched from DDR)</text>
<text x="35" y="290.0" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" transform="rotate(-90 35 290.0)">Throughput (GMAC/s)</text>
<line x1="90.0" y1="426.608149544718" x2="717.1956991761565" y2="80.0" stroke="#1f6fb2" stroke-width="2.5"/>
<text x="193.3729284265524" y="359.4810048879391" font-size="12" fill="#1f6fb2" text-anchor="start" font-weight="bold" transform="rotate(-45 193.3729284265524 359.4810048879391)">DDR3 ≈ 5 GB/s</text>
<line x1="90.0" y1="278.74295318697386" x2="850.0" y2="278.74295318697386" stroke="#c8781a" stroke-width="2.5" stroke-dasharray="8,5"/>
<text x="96.0" y="272.74295318697386" font-size="11" fill="#c8781a" text-anchor="start" font-weight="bold">8×8 array peak: 12.8 GMAC/s (64 MAC/clk × 200 MHz)</text>
<line x1="90.0" y1="164.43053649703046" x2="850.0" y2="164.43053649703046" stroke="#2e8b57" stroke-width="2.5"/>
<text x="96.0" y="158.43053649703046" font-size="11" fill="#2e8b57" text-anchor="start" font-weight="bold">Full chip, 784 PEs (840 DSPs): 157 GMAC/s</text>
<line x1="357.56559340925145" y1="278.74295318697386" x2="357.56559340925145" y2="500" stroke="#c8781a" stroke-width="1" stroke-dasharray="3,3"/>
<text x="357.56559340925145" y="494" font-size="10" fill="#c8781a" text-anchor="middle" font-weight="normal">2.6</text>
<line x1="564.4166331339109" y1="164.43053649703046" x2="564.4166331339109" y2="500" stroke="#2e8b57" stroke-width="1" stroke-dasharray="3,3"/>
<text x="564.4166331339109" y="494" font-size="10" fill="#2e8b57" text-anchor="middle" font-weight="normal">31</text>
<text x="180.65303839673584" y="418.2941187097174" font-size="13" fill="#1f6fb2" text-anchor="start" font-weight="bold">MEMORY-BOUND</text>
<text x="180.65303839673584" y="439.12272235523494" font-size="11" fill="#1f6fb2" text-anchor="start" font-weight="normal">adding DSPs does nothing here</text>
<text x="693.4573392205795" y="418.2941187097174" font-size="13" fill="#2e8b57" text-anchor="start" font-weight="bold">COMPUTE-BOUND</text>
<text x="693.4573392205795" y="439.12272235523494" font-size="11" fill="#2e8b57" text-anchor="start" font-weight="normal">more DSPs = faster</text>
<circle cx="280.0" cy="321.608149544718" r="6" fill="#c0392b" stroke="#fff" stroke-width="2"/>
<text x="290.0" y="307.608149544718" font-size="11" fill="#c0392b" text-anchor="start" font-weight="bold">LLM, batch 1 (GPT-2 small): 1 MAC/byte → 5 GMAC/s, 25 ms/token</text>
<circle cx="565.9784958807822" cy="164.43053649703046" r="6" fill="#c0392b" stroke="#fff" stroke-width="2"/>
<text x="575.9784958807822" y="152.43053649703046" font-size="11" fill="#c0392b" text-anchor="start" font-weight="bold">LLM, batch 32 → finally fills the full chip</text>
<circle cx="623.1741950569385" cy="278.74295318697386" r="6" fill="#c8781a" stroke="#fff" stroke-width="2"/>
<text x="633.1741950569385" y="294.74295318697386" font-size="11" fill="#c8781a" text-anchor="start" font-weight="bold">MNIST MLP batch 64 on the 8×8: compute-bound</text>
<circle cx="602.8043008238435" cy="164.43053649703046" r="6" fill="#2e8b57" stroke="#fff" stroke-width="2"/>
<text x="612.8043008238435" y="182.43053649703046" font-size="11" fill="#2e8b57" text-anchor="start" font-weight="bold">CNN (ResNet-18, high weight reuse)</text>
<text x="20" y="530" font-size="11" fill="#333" text-anchor="start" font-weight="normal">How to read it: find your workload's intensity on the x-axis, go up until you hit the first line. That line is your limit.</text>
<text x="20" y="548" font-size="11" fill="#333" text-anchor="start" font-weight="normal">At batch 1 an LLM uses each weight byte once (1 MAC/byte): it hits the blue DDR line at 5 GMAC/s, below even the 8×8 array's ceiling.</text>
<text x="20" y="566" font-size="11" fill="#333" text-anchor="start" font-weight="normal">Batching B inputs reuses each weight B times, sliding the point right. Only past ~31 MAC/byte would the full 840-DSP chip stop idling.</text>
<text x="20" y="584" font-size="11" fill="#333" text-anchor="start" font-weight="normal">CNNs reuse every weight at every pixel position, so they sit far right: compute-bound. That is why scaling the array pays off for CNNs and not for batch-1 LLMs.</text>
<text x="20" y="602" font-size="10" fill="#777" text-anchor="start" font-weight="normal">Numbers: Kintex-7-class board, DDR3 ≈ 5 GB/s realistic, 200 MHz, INT8 weights (1 byte each). Change the board and the lines move, the shape does not.</text>
</svg>